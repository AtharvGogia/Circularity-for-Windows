name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'src/Circularity.sln'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/Circularity.sln

      - name: Build solution
        run: dotnet build src/Circularity.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test src/Circularity.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      # The engine's end-to-end checks (EngineSmokeTest is a console app, not a test project, so
      # `dotnet test` can't run it). They convert real files, so they need FFmpeg.
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Run smoke tests
        run: |
          $env:FFMPEG_PATH = (Get-Command ffmpeg.exe).Source
          dotnet run --project src/EngineSmokeTest --no-build --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  check-format:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check code formatting
        run: dotnet format src/Circularity.sln --verify-no-changes --verbosity diagnostic

# Releases are built and published by hand (build/build.ps1, then `gh release create` with written
# notes): the installer bundles a custom FFmpeg build and needs Inno Setup, neither of which is on
# the runners yet.
