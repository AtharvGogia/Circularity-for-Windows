name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'src/Circularity.sln'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/Circularity.sln

      - name: Build solution
        run: dotnet build src/Circularity.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test src/Circularity.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run smoke tests
        run: dotnet test src/EngineSmokeTest --no-build --configuration Release --logger "console;verbosity=normal"
        continue-on-error: true

  check-format:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check code formatting
        run: dotnet format src/Circularity.sln --verify-no-changes --verbosity diagnostic

  release:
    needs: [build-and-test, check-format]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/Circularity.sln

      - name: Build solution
        run: dotnet build src/Circularity.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test src/Circularity.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Build installer
        run: |
          cd build
          powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Circularity-Installer
          path: artifacts/CircularitySetup-*.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/CircularitySetup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}